[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrasse"
version = "0.1.0"
description = "An agent harness that holds the plan."
requires-python = ">=3.11"
dependencies = ["anthropic", "pymongo", "rich", "python-dotenv", "pytest"]

[project.scripts]
wrasse = "wrasse.main:main"

[tool.setuptools]
packages = ["wrasse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
